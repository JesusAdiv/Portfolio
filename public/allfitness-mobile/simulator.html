<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllFitness Flutter App — Demo en Vivo | Jesús Adiv Barroso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #060911;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.14), transparent 38%),
        radial-gradient(circle at 85% 25%, rgba(16, 185, 129, 0.12), transparent 40%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .topbar {
      width: 100%;
      background: rgba(9, 13, 24, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.22);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
    }
    .badge-live {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #e2e8f0;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.16);
      color: #fff;
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      width: 100%;
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      max-height: calc(100vh - 90px);
      border: 12px solid #1e1e1e;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 35px rgba(14, 165, 233, 0.18);
      background: #000;
      position: relative;
    }
    .phone-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    @media (max-width: 480px) {
      .topbar { display: none; }
      .stage { padding: 0; }
      .phone-frame {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border: none;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>📱 AllFitness — App Móvil en Vivo (Compilación Real Flutter & Dart)</span>
      <span class="badge-live">● 100% Código Real Flutter</span>
    </div>
    <div class="actions">
      <button class="btn" onclick="document.getElementById('flutterFrame').src = './index.html?v=' + Date.now()">↻ Reiniciar App</button>
      <a class="btn" href="./index.html" target="_blank" rel="noopener noreferrer">⛶ Pantalla Completa</a>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.kyndrasoft.allfitness&pcampaignid=web_share" target="_blank" rel="noopener noreferrer">▶️ Google Play</a>
    </div>
  </header>

  <main class="stage">
    <div class="phone-frame">
      <iframe
        id="flutterFrame"
        src="./index.html?v=2"
        class="phone-iframe"
        title="AllFitness Flutter Live Demo"
      ></iframe>
    </div>
  </main>
</body>
</html>
