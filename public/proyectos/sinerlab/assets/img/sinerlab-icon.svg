  <!-- Cruz Clínica Moderna / Central -->
  <path d="M29 20 H35 V28 H43 V34 H35 V42 H29 V34 H21 V28 H29 Z" fill="url(#crossIconGrad)" />
  
  <!-- Puntos moleculares -->
  <circle cx="32" cy="10" r="3" fill="#ffffff" />
  <circle cx="52" cy="22" r="3" fill="#38bdf8" />
  <circle cx="52" cy="44" r="3" fill="#ffffff" />
  <circle cx="32" cy="56" r="3" fill="#38bdf8" />
  <circle cx="12" cy="44" r="3" fill="#ffffff" />
  <circle cx="12" cy="22" r="3" fill="#38bdf8" />
</svg>
