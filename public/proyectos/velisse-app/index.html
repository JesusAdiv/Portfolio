  <base href="/">
  <script>
    (function () {
      try {
        var baseEl = document.querySelector('base');
        if (!baseEl) return;
        var currentHref = baseEl.getAttribute('href') || '/';
        if (currentHref !== '/' && currentHref !== './') return;
        var pathname = window.location.pathname || '/';
        var routeRoots = [
          'new', 'login', 'register', 'password-reset', 'contact', 'dashboard',
          'events', 'invitations', 'check-in', 'external-access', 'i', 'e',
          'embed', 'documentacion', 'api-docs', 'unauthorized'
        ];
        var parts = pathname.split('/').filter(Boolean);
        var routeIdx = -1;
        for (var i = 0; i < parts.length; i++) {
          if (routeRoots.indexOf(parts[i]) !== -1) {
            routeIdx = i;
            break;
          }
        }
        var basePath = '/';
        if (routeIdx > 0) {
          basePath = '/' + parts.slice(0, routeIdx).join('/') + '/';
        } else if (routeIdx === -1 && parts.length > 0) {
          var last = parts[parts.length - 1];
          if (last.indexOf('.') !== -1) {
            basePath = parts.length > 1 ? '/' + parts.slice(0, parts.length - 1).join('/') + '/' : '/';
          } else {
            basePath = '/' + parts.join('/') + '/';
          }
        }
        baseEl.setAttribute('href', basePath);
      } catch (e) { }
    })();
  </script>
